name: Verify final project
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: cafe, POSTGRES_PASSWORD: ci-local-password, POSTGRES_DB: cafe}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cafe -d cafe"
          --health-interval 3s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://cafe:ci-local-password@localhost:5432/cafe
      JWT_SECRET: ci-signing-key-for-isolated-tests-only
      ADMIN_PASSWORD: ci-test-password-only
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm run setup
      - run: npx --prefix tools playwright install --with-deps chromium
      - run: npm run build
      - run: npm run seed
      - run: |
          npm start > /tmp/dashfood.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://localhost:4000/api/health && break; sleep 1; done
          npm test
          npm run test:browser
          node tools/final-checks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: verification-evidence, path: output/evidence}
