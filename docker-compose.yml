services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run setup.ps1 first}
      POSTGRES_DB: cafe
    volumes: [dashfood_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cafe -d cafe"]
      interval: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgres://cafe:${DB_PASSWORD}@db:5432/cafe
      JWT_SECRET: ${JWT_SECRET:?Run setup.ps1 first}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run setup.ps1 first}
      CORS_ORIGIN: http://localhost:4000
      TRUST_PROXY: 1
    ports: ["4000:4000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
  https:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DASHFOOD_DOMAIN: ${DASHFOOD_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  dashfood_pgdata:
  caddy_data:
  caddy_config:
