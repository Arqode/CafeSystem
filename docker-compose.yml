services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: cafe, POSTGRES_PASSWORD: cafe, POSTGRES_DB: cafe }
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U cafe"], interval: 3s, retries: 10 }
  api:
    build: ./server
    env_file: ./server/.env
    environment: { DATABASE_URL: "postgres://cafe:cafe@db:5432/cafe" }
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {} }

